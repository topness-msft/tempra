<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF9F5" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="A quiet record of hot flashes, their symptoms, and how they felt." />

    <title>Tempra</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- Lets the Home Screen icon open without Safari chrome, which is the only
         way the bedside experience feels like an app rather than a web page. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tempra" />

    <!-- Nothing here leaves the device unnecessarily; fonts are bundled, not fetched. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
