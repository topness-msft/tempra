# The Fly app name. It also decides the default hostname, which is
# https://<app>.fly.dev — so changing this changes the address the iOS Shortcut
# and the bedside button post to. Forking? Set your own name here before the
# first deploy; the docs call that address https://your-app.fly.dev.
app = "tempra"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DATA_DIR = "/data"
  DB_FILE = "tempra.db"
  NODE_ENV = "production"

[[mounts]]
  source = "tempra_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # This app must answer at 3am from a phone with one bar. That argued for
  # keeping a machine up, but the argument was against a *cold start* — a boot
  # takes seconds. Suspend restores a memory snapshot in a few hundred ms, which
  # nobody notices, so the machine sleeps when idle and wakes on the first
  # request. Compute is only billed while awake; the volume is billed either way.
  #
  # The web app never waits on this: it is offline-first, so a tap at 3am lands
  # in the local outbox and syncs afterwards. The paths that do wait are the ones
  # with no outbox — the iOS Shortcut and the bedside button — and a few hundred
  # ms is invisible to both.
  #
  # min_machines_running must be 0. With one machine, leaving it at 1 makes that
  # machine the minimum, and it would never suspend no matter what is set above.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
